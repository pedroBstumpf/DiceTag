version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
      tiptap:
        patterns: ["@tiptap/*"]
      tooling:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "angular-eslint", "prettier*", "vitest*", "@vitest/*", "husky", "lint-staged", "@commitlint/*"]
    ignore:
      # Majors do Angular vão por `ng update` manual (migrações automáticas)
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # Andam junto com o major do Angular (o Angular 21 exige o TypeScript 5.9): sobem no mesmo `ng update`
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
    labels: ["dependencies", "area:front"]
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]
      tooling:
        patterns: ["typescript", "vitest*", "@vitest/*", "@types/*", "tsx", "esbuild"]
    ignore:
      # O TypeScript acompanha o do front; os tipos do Node acompanham o Node usado (24, ver .nvmrc)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
    labels: ["dependencies", "area:back"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
    labels: ["dependencies", "area:ci"]
