# Verificação automática em cada pull request e em cada push na main:
# o mesmo que o README pede antes de mesclar — build e testes do front-end e `npm run check` do
# servidor (tipos, testes e npm audit). Roda no Windows, o sistema em que a mesa roda de verdade.
# O `npm run e2e` (dois navegadores, Tailscale de mentira) fica de fora: precisa do Chrome e de um
# `npm run mesa` isolado, e é rodado à mão.
name: Verificação

on:
  push:
    branches: [main]
  pull_request:

# Só lê o repositório: a verificação não publica nada nem escreve no GitHub
permissions:
  contents: read

# Envio novo na mesma branch cancela a verificação anterior, que ficou velha
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Front-end (build e testes)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false

  servidor:
    name: Servidor (tipos, testes e audit)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
