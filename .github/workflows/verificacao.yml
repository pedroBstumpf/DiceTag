# Verificação automática em cada pull request e em cada push na main:
# lint e tipos, audit, build e testes (com cobertura) do front-end e `npm run check` do servidor
# (tipos, testes e npm audit). Roda no Windows, o sistema em que a mesa roda de verdade.
# O `npm run e2e` (dois navegadores, Tailscale de mentira) fica de fora: precisa do Chrome e de um
# `npm run mesa` isolado, e é rodado à mão.
name: Verificação

on:
  push:
    branches: [main]
  pull_request:

# Só lê o repositório: a verificação não publica nada nem escreve no GitHub
permissions:
  contents: read

# Envio novo na mesma branch cancela a verificação anterior, que ficou velha
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Regras completas para código novo; a dívida antiga está congelada em eslint-suppressions.json
      - run: npm run lint
      - run: npm run typecheck

  front:
    name: Front-end (build e testes)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit
      - run: npm run build
      - run: npm run test:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cobertura-front
          path: coverage/
          retention-days: 14

  servidor:
    name: Servidor (tipos, testes e audit)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
