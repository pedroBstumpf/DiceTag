# Procura segredos (chaves, senhas, tokens) no que foi enviado (doc 04 §7). Complementa o secret scanning do GitHub.
name: Segredos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: segredos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
