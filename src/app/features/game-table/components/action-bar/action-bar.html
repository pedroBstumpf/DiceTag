<div class="glass flex items-center gap-2 rounded-xl p-1.5 shadow-xl shadow-black/40">
  <!-- Papel atual: mestre ou jogador -->
  <div class="flex shrink-0 flex-col gap-1 rounded-lg bg-ink-950/60 p-1 text-[11px] font-semibold">
    <button
      type="button"
      class="rounded-md px-2 py-1 transition-colors"
      [class]="session.role() === 'gm' ? 'bg-astral-500/25 text-astral-300' : 'text-slate-500 hover:text-slate-300'"
      matTooltip="Ações do mestre"
      (click)="session.setRole('gm')"
    >
      MESTRE
    </button>
    <button
      type="button"
      class="rounded-md px-2 py-1 transition-colors"
      [class]="session.role() === 'player' ? 'bg-astral-500/25 text-astral-300' : 'text-slate-500 hover:text-slate-300'"
      matTooltip="Ações do jogador"
      (click)="session.setRole('player')"
    >
      JOGADOR
    </button>
  </div>

  <!-- Quem está agindo: o mestre escolhe (fixo ou seguindo o token selecionado) -->
  @if (session.role() === 'gm') {
    <button
      type="button"
      class="flex w-24 shrink-0 flex-col justify-center rounded-md px-1 text-left leading-tight hover:bg-white/5"
      matTooltip="Escolher como quem o mestre age"
      [matMenuTriggerFor]="actingMenu"
    >
      <span class="flex items-center gap-0.5 text-[10px] uppercase tracking-widest text-slate-500">
        Agindo
        <mat-icon class="!size-3.5 !text-[14px]">{{ following() ? 'ads_click' : 'push_pin' }}</mat-icon>
      </span>
      <span class="truncate text-xs font-semibold text-star-300">{{ actorLabel() }}</span>
    </button>
    <mat-menu #actingMenu="matMenu">
      <button mat-menu-item (click)="session.gmActing.set(selection)">
        <mat-icon>ads_click</mat-icon>
        <span>Token selecionado (segue a seleção)</span>
      </button>
      <button mat-menu-item (click)="session.gmActing.set(null)">
        <mat-icon>bolt</mat-icon>
        <span>Ações gerais do mestre</span>
      </button>
      @for (e of actingOptions(); track e.id) {
        <button mat-menu-item (click)="session.gmActing.set(e.id)">
          <mat-icon [class]="e.kind === 'npc' ? 'text-violet-300' : 'text-astral-300'">{{ e.kind === 'npc' ? 'smart_toy' : 'person' }}</mat-icon>
          <span>{{ e.name }}</span>
        </button>
      }
    </mat-menu>
  } @else {
    <div class="flex w-20 shrink-0 flex-col justify-center leading-tight">
      <span class="text-[10px] uppercase tracking-widest text-slate-500">Agindo</span>
      <span class="truncate text-xs font-semibold text-star-300">{{ actorLabel() }}</span>
    </div>
  }

  <!-- Espaços de ação -->
  <div class="flex gap-1.5 overflow-x-auto">
    @for (slot of slots(); track slot.key; let i = $index) {
      <button
        type="button"
        class="relative grid size-14 shrink-0 place-items-center rounded-lg border transition-all"
        [class]="
          slot.entry
            ? 'border-astral-400/30 bg-gradient-to-b from-ink-700 to-ink-850 text-star-300 hover:border-astral-300/70 hover:shadow-[0_0_14px_rgb(122_167_255/0.35)]'
            : 'border-dashed border-white/10 text-slate-600 hover:border-white/25 hover:text-slate-400'
        "
        [class.scale-90]="flashing() === slot.entry?.id"
        [class.opacity-40]="!slot.entry && !canCreate()"
        [matTooltip]="slot.entry ? slot.entry.name + ' (' + slot.key + ') · clique direito: configurar' : emptyHint()"
        (click)="trigger(i)"
        (contextmenu)="$event.preventDefault(); slot.entry && opened.emit(slot.entry.id)"
      >
        <mat-icon>{{ slot.entry ? (slot.entry.icon ?? 'bolt') : 'add' }}</mat-icon>
        <span class="absolute left-1 top-0.5 text-[10px] font-semibold text-slate-500">{{ slot.key }}</span>
        @if (slot.entry) {
          <span class="absolute inset-x-1 bottom-0.5 truncate text-center text-[9px] leading-tight text-slate-400">{{ slot.entry.name }}</span>
        }
      </button>
    }
  </div>

  <button
    type="button"
    class="grid size-8 shrink-0 place-items-center self-start rounded-md text-slate-500 hover:bg-white/10 hover:text-white"
    matTooltip="Esconder barra de ações"
    (click)="session.togglePanel('actions')"
  >
    <mat-icon class="!text-[18px]">keyboard_arrow_down</mat-icon>
  </button>
</div>
